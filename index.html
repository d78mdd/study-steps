<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study in Steps</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1f2328;--mute:#6b7280;--acc:#3d5afe;--accink:#fff;--line:#e5e1d8;--ok:#1b7f4b;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1e2128;--ink:#eceff4;--mute:#9aa3b2;--acc:#8c9eff;--accink:#10131a;--line:#2e333d;--ok:#5fd394;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1e2128;--ink:#eceff4;--mute:#9aa3b2;--acc:#8c9eff;--accink:#10131a;--line:#2e333d;--ok:#5fd394;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 4px}h2{font-size:1.2rem;margin:0 0 8px}
.mute{color:var(--mute);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
textarea{width:100%;min-height:160px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
button{font:inherit;font-weight:600;background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:12px 18px;cursor:pointer;margin-top:10px}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:disabled{opacity:.5}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{font-weight:600;margin:14px 0 8px}
.fb{margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>Study in Steps</h1>
  <p class="mute">Paste your notes or reading. I’ll break it into small steps, teach each one, and check you understood before moving on.</p>

  <section id="setup">
    <textarea id="src" placeholder="Paste your study material here, or upload a PDF below…"></textarea>
    <div style="margin-top:10px"><label class="mute" for="pdf">Or upload a PDF or PowerPoint (.pptx): </label><input type="file" id="pdf" accept="application/pdf,.pdf,.pptx,.ppt"><div id="range" class="hide" style="margin-top:8px"><span class="mute">Pages </span><input type="number" id="from" min="1" value="1" style="width:70px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"> <span class="mute">to</span> <input type="number" id="to" min="1" value="10" style="width:70px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"> <button id="load" class="alt" style="margin:0;padding:8px 14px">Load pages</button></div><div id="pdfmsg" class="mute"></div></div>
    <button id="build">Build my study plan</button>
    <p id="err" class="bad hide"></p>
  </section>

  <section id="study" class="hide">
    <div class="mute" id="count"></div>
    <div class="bar"><i id="prog" style="width:0"></i></div>
    <div class="card">
      <h2 id="stitle"></h2>
      <div id="explain"></div>
      <div class="q" id="question"></div>
      <textarea id="ans" style="min-height:90px" placeholder="Answer in your own words…"></textarea>
      <button id="check">Check my answer</button>
      <div id="fb" class="fb hide"></div>
      <button id="next" class="hide">Next step</button>
    </div>
  </section>

  <section id="done" class="hide">
    <div class="card">
      <h2>All steps complete 🎉</h2>
      <p id="score"></p>
      <button id="again" class="alt">Study something new</button>
    </div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var plan=[],idx=0,right=0,sample=null;

  function show(id){["setup","study","done"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
  function err(m){var e=$("err");e.textContent=m;e.classList.toggle("hide",!m)}

  async function getSample(){
    if(sample)return sample;
    try{sample=await claude.use("sample")}catch(e){sample=null}
    return sample;
  }

  $("build").onclick=async function(){
    var text=$("src").value.trim();
    if(text.length<80){err("Please paste a bit more material (at least a few sentences).");return}
    err("");
    var b=$("build");b.disabled=true;b.textContent="Building your plan…";
    try{
      var s=await getSample();
      if(!s){err("This page needs Claude access to build a plan. Open it in the Claude app and allow access.");return}
      plan=await s.json(
        "You are a study coach. Using ONLY the material below, and writing in the same language as the material, break it into 4 to 7 ordered learning steps, from foundations to harder ideas. "+
        "Return only JSON: {\"steps\":[{\"title\":\"short title\",\"explain\":\"clear 2-4 sentence explanation in plain language\",\"question\":\"one question testing understanding of this step\"}]}\n\nMATERIAL:\n"+text.slice(0,MAX)
      ,{cache:false});
      plan=(plan&&plan.steps)||[];
      if(!plan.length)throw new Error("empty");
      idx=0;right=0;render();show("study");
    }catch(e){
      err(e&&e.code==="not_granted"?"Access was declined, so I can’t build the plan.":"Something went wrong building the plan. Please try again.");
    }finally{b.disabled=false;b.textContent="Build my study plan"}
  };

  function render(){
    var st=plan[idx];
    $("count").textContent="Step "+(idx+1)+" of "+plan.length;
    $("prog").style.width=(idx/plan.length*100)+"%";
    $("stitle").textContent=st.title;
    $("explain").textContent=st.explain;
    $("question").textContent=st.question;
    $("ans").value="";$("ans").disabled=false;
    $("check").classList.remove("hide");$("check").disabled=false;
    $("fb").classList.add("hide");$("next").classList.add("hide");
    $("next").textContent=idx===plan.length-1?"Finish":"Next step";
  }

  $("check").onclick=async function(){
    var a=$("ans").value.trim();
    if(!a)return;
    var c=$("check");c.disabled=true;c.textContent="Checking…";
    try{
      var st=plan[idx],s=await getSample();
      var r=await s.json(
        "Study step: "+st.title+"\nExplanation given: "+st.explain+"\nQuestion: "+st.question+"\nStudent answer: "+a+
        "\n\nJudge the answer kindly, replying in the same language as the student’s answer. Return only JSON: {\"correct\":true|false,\"feedback\":\"1-3 sentences: what was right, and what to fix or the correct answer if wrong\"}"
      ,{cache:false});
      if(r.correct)right++;
      var f=$("fb");
      f.innerHTML="";
      var h=document.createElement("strong");
      h.className=r.correct?"ok":"bad";
      h.textContent=r.correct?"Nice, that’s right. ":"Not quite. ";
      f.appendChild(h);
      f.appendChild(document.createTextNode(r.feedback||""));
      f.classList.remove("hide");
      $("ans").disabled=true;c.classList.add("hide");$("next").classList.remove("hide");
    }catch(e){
      var f2=$("fb");f2.textContent="Couldn’t check that just now. Try again.";f2.classList.remove("hide");
    }finally{c.disabled=false;c.textContent="Check my answer"}
  };

  $("next").onclick=function(){
    idx++;
    if(idx>=plan.length){
      $("prog").style.width="100%";
      $("score").textContent="You got "+right+" of "+plan.length+" steps right on the first try.";
      show("done");
    }else render();
  };

  $("pdf").onchange=async function(ev){
    var f=ev.target.files&&ev.target.files[0],m=$("pdfmsg");
    if(!f)return;
    err("");
    if(/\.pptx$/i.test(f.name)){await readPptx(f,m);return}
    if(/\.ppt$/i.test(f.name)){m.textContent="Old .ppt files can’t be read here. In PowerPoint, use Save As and choose .pptx, then upload that.";return}
    slides=null;
    if(!window.pdfjsLib){m.textContent="The PDF reader didn’t load. Please paste the text instead.";return}
    m.textContent="Reading PDF…";
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc="pdf.worker.min.js";
      pdfDoc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      $("range").classList.remove("hide");
      $("from").value=1;$("to").value=Math.min(10,pdfDoc.numPages);
      await loadRange();
    }catch(e){m.textContent="Couldn’t read that PDF. Try another file or paste the text."}
  };
  var pdfDoc=null,slides=null,MAX=40000;
  async function readPptx(f,m){
    m.textContent="Reading PowerPoint…";
    try{
      if(!window.JSZip)throw new Error("nozip");
      var z=await JSZip.loadAsync(await f.arrayBuffer());
      var names=Object.keys(z.files).filter(function(k){return /^ppt\/slides\/slide\d+\.xml$/.test(k)});
      names.sort(function(a,b){return parseInt(a.match(/(\d+)\.xml/)[1])-parseInt(b.match(/(\d+)\.xml/)[1])});
      if(!names.length){m.textContent="I couldn’t find any slides in that file.";return}
      var out=[];
      for(var i=0;i<names.length;i++){
        var xml=await z.files[names[i]].async("string");
        var d=new DOMParser().parseFromString(xml,"application/xml");
        var ps=d.getElementsByTagName("a:p"),lines=[];
        for(var j=0;j<ps.length;j++){
          var ts=ps[j].getElementsByTagName("a:t"),s="";
          for(var k=0;k<ts.length;k++)s+=ts[k].textContent;
          if(s.trim())lines.push(s.trim());
        }
        out.push(lines.join("\n"));
      }
      slides=out;pdfDoc=null;
      $("range").classList.remove("hide");
      $("from").value=1;$("to").value=Math.min(20,out.length);
      await loadRange();
    }catch(e){m.textContent="Couldn’t read that PowerPoint file. Try another file or paste the text."}
  }
  async function loadRange(){
    var m=$("pdfmsg"),n=slides?slides.length:pdfDoc.numPages;
    var a=Math.max(1,Math.min(n,parseInt($("from").value)||1)),b=Math.max(a,Math.min(n,parseInt($("to").value)||a));
    $("from").value=a;$("to").value=b;
    m.textContent="Reading pages "+a+"–"+b+"…";
    try{
      var out=[];
      for(var p=a;p<=b;p++){
        if(slides){out.push("Slide "+p+": "+slides[p-1]);continue}
        var pg=await pdfDoc.getPage(p),tc=await pg.getTextContent();
        out.push(tc.items.map(function(i){return i.str}).join(" "));
      }
      var txt=out.join("\n\n").replace(/[ \t]+/g," ").trim();
      if(txt.length<80){m.textContent="No readable text on pages "+a+"–"+b+" of "+n+". They may be scans or images; try other pages.";return}
      $("src").value=txt;
      m.textContent="Loaded pages "+a+"–"+b+" of "+n+" ("+txt.length+" characters"+(txt.length>MAX?"; only the first "+MAX+" will be used, so pick fewer pages":"")+"). You can edit the text before building.";
    }catch(e){m.textContent="Couldn’t read those pages. Try again."}
  }
  $("load").onclick=function(){if(pdfDoc||slides)loadRange()};

  $("again").onclick=function(){$("src").value="";show("setup")};
})();
</script>
</body>
</html>
